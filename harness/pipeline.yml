pipeline:
  identifier: ecommerce_ci
  name: Ecommerce CI - Build and Push
  orgIdentifier: default
  projectIdentifier: default_project
  description: Builds and pushes Docker images for all 3 microservices to Google Artifact Registry
  tags:
    team: platform

  properties:
    ci:
      codebase:
        connectorRef: account.githubecommerce
        repoName: e-commerce-microservices
        build: <+input>

  stages:
    # ─────────────────────────────────────────────────────────────
    # STAGE 1: Build & Push Product Service
    # ─────────────────────────────────────────────────────────────
    - stage:
        identifier: build_product_service
        name: Build - Product Service
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: gke_ecommerce
              namespace: harness-builds
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  identifier: run_tests_product
                  name: Run Unit Tests
                  type: Run
                  spec:
                    connectorRef: account.harnessImage
                    image: maven:3.9.5-eclipse-temurin-17
                    shell: Sh
                    command: |
                      cd product-service
                      mvn clean test -B
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - "product-service/target/surefire-reports/*.xml"

              - step:
                  identifier: build_push_product
                  name: Build and Push Image
                  type: BuildAndPushGAR
                  spec:
                    connectorRef: gar_ecommerce
                    host: us-central1-docker.pkg.dev
                    projectID: brilliant-tide-453616-r9
                    imageName: ecommerce-repo/product-service
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
                    dockerfile: product-service/Dockerfile
                    context: product-service

    # ─────────────────────────────────────────────────────────────
    # STAGE 2: Build & Push Order Service
    # ─────────────────────────────────────────────────────────────
    - stage:
        identifier: build_order_service
        name: Build - Order Service
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: gke_ecommerce
              namespace: harness-builds
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  identifier: run_tests_order
                  name: Run Unit Tests
                  type: Run
                  spec:
                    connectorRef: account.harnessImage
                    image: maven:3.9.5-eclipse-temurin-17
                    shell: Sh
                    command: |
                      cd order-service
                      mvn clean test -B
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - "order-service/target/surefire-reports/*.xml"

              - step:
                  identifier: build_push_order
                  name: Build and Push Image
                  type: BuildAndPushGAR
                  spec:
                    connectorRef: gar_ecommerce
                    host: us-central1-docker.pkg.dev
                    projectID: brilliant-tide-453616-r9
                    imageName: ecommerce-repo/order-service
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
                    dockerfile: order-service/Dockerfile
                    context: order-service

    # ─────────────────────────────────────────────────────────────
    # STAGE 3: Build & Push API Gateway
    # ─────────────────────────────────────────────────────────────
    - stage:
        identifier: build_api_gateway
        name: Build - API Gateway
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: gke_ecommerce
              namespace: harness-builds
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  identifier: run_tests_gateway
                  name: Run Unit Tests
                  type: Run
                  spec:
                    connectorRef: account.harnessImage
                    image: maven:3.9.5-eclipse-temurin-17
                    shell: Sh
                    command: |
                      cd api-gateway
                      mvn clean test -B
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - "api-gateway/target/surefire-reports/*.xml"

              - step:
                  identifier: build_push_gateway
                  name: Build and Push Image
                  type: BuildAndPushGAR
                  spec:
                    connectorRef: gar_ecommerce
                    host: us-central1-docker.pkg.dev
                    projectID: brilliant-tide-453616-r9
                    imageName: ecommerce-repo/api-gateway
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
                    dockerfile: api-gateway/Dockerfile
                    context: api-gateway
